<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    overflow-x:hidden;

    background:#111;

}

/*=========================
BACKGROUND
==========================*/

.bg-image{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    opacity:0;

    transition:opacity 2s ease-in-out;

    z-index:-2;

}

#bg1{

    opacity:1;

}

.visible{

    opacity:1;

}

/* Dark Overlay */

body::before{

    content:"";

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.45);

    z-index:-1;

}

/*=========================
HEADER
==========================*/

#welcome{

    width:100%;

    height:70px;

    background:rgba(21,122,31,.85);

    backdrop-filter:blur(6px);

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

}

#logo{

    position:absolute;

    left:15px;

    width:52px;

    height:52px;

    border-radius:50%;

    border:2px solid white;

    object-fit:cover;

}

#welcome h2{

    color:white;

    letter-spacing:1px;

}

/*=========================
CONTAINER
==========================*/

#container{

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px 20px;

}

/*=========================
FORM
==========================*/

form{

    width:430px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(12px);

    border-radius:15px;

    padding:25px;

    color:white;

    box-shadow:0 10px 30px rgba(0,0,0,.35);

}

form h2{

    text-align:center;

    margin-bottom:20px;

}

label{

    display:block;

    margin-top:10px;

    margin-bottom:5px;

    font-weight:bold;

}

input{

    width:100%;

    padding:11px;

    border:none;

    border-radius:6px;

    outline:none;

    font-size:15px;

}

.password-wrapper{

    position:relative;

}

.toggle-password{

    position:absolute;

    top:50%;

    right:10px;

    transform:translateY(-50%);

    width:22px;

    height:22px;

    cursor:pointer;

    fill:#444;

}

/*=========================
COUNTRY SELECTOR
==========================*/

.country-selector{

    position:relative;

}

#countrySearch{

    width:100%;

}

.dropdown{

    position:absolute;

    width:100%;

    max-height:180px;

    overflow-y:auto;

    background:white;

    color:black;

    border-radius:6px;

    display:none;

    z-index:999;

}

.dropdown-item{

    display:flex;

    align-items:center;

    padding:8px;

    cursor:pointer;

}

.dropdown-item:hover{

    background:#eee;

}

.dropdown-item img{

    width:20px;

    margin-right:10px;

}

/*=========================
ERRORS
==========================*/

.error{

    color:#ff8a8a;

    font-size:13px;

    margin-top:3px;

/*=========================
SUCCESS MESSAGE
==========================*/

#message{

    display:none;

    margin-top:15px;

    border-radius:8px;

    font-weight:bold;

    text-align:center;

}

.success{

    display:block;

    color:#155724;

}

.failure{

    background:#f8d7da;

    color:#721c24;

}

/*=========================
BUTTON
==========================*/

    color:white;

}

button:hover{

button:disabled{

/*=========================
LOGIN LINK
==========================*/

#loginLink a{

}

/*=========================
RESPONSIVE
==========================*/

@media(max-width:600px){

}

// ===========================
// COUNTRY SELECTOR
// ===========================

const countrySearch = document.getElementById("countrySearch");
const countryDropdown = document.getElementById("countryDropdown");
const nationalityInput = document.getElementById("nationality");

function populateCountries(search = "") {

    countryDropdown.innerHTML = "";

    const filtered = countries.filter(country =>
        country.name.toLowerCase().includes(search.toLowerCase())
    );

    filtered.forEach(country => {

        const item = document.createElement("div");

        item.className = "dropdown-item";

        item.innerHTML = `
            <img
            src="https://flagcdn.com/w20/${country.code}.png"
            alt="${country.name}">
            ${country.name}
        `;

        item.onclick = () => {

            countrySearch.value = country.name;

            nationalityInput.value = country.name;

            countryDropdown.style.display = "none";

        };

        countryDropdown.appendChild(item);

    });

    countryDropdown.style.display =
        filtered.length ? "block" : "none";

}

countrySearch.addEventListener("focus", () => {

    populateCountries(countrySearch.value);

});

countrySearch.addEventListener("input", () => {

    populateCountries(countrySearch.value);

});

document.addEventListener("click", e => {

    if (
        !countrySearch.contains(e.target) &&
        !countryDropdown.contains(e.target)
    ) {

        countryDropdown.style.display = "none";

    }

});

document.querySelectorAll(".toggle-password").forEach(icon => {

    icon.addEventListener("click", () => {

        const input =
            document.getElementById(
                icon.dataset.target
            );

        if (input.type === "password") {

            input.type = "text";

            icon.style.fill = "#1976d2";

        } else {

            input.type = "password";

            icon.style.fill = "#444";

        }

    });

});

// ===========================
// FORM VALIDATION
// ===========================

function validateForm() {

    clearErrors();

    let valid = true;

    const firstName = signupForm.firstName.value.trim();
    const secondName = signupForm.secondName.value.trim();
    const email = signupForm.email.value.trim();
    const phone = signupForm.phone.value.trim();
    const dob = signupForm.dob.value.trim();
    const nationality = nationalityInput.value.trim();
    const password = signupForm.password.value;
    const confirmPassword = signupForm.confirmPassword.value;

    // First Name
    if (firstName === "") {
        document.getElementById("firstNameError").textContent =
            "First name is required.";
        valid = false;
    }

    // Second Name
    if (secondName === "") {
        document.getElementById("secondNameError").textContent =
            "Second name is required.";
        valid = false;
    }

    // Email
    if (email === "") {

        document.getElementById("emailError").textContent =
            "Email is required.";

        valid = false;

    } else if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    ) {

        document.getElementById("emailError").textContent =
            "Please enter a valid email address.";

        valid = false;

    }

    // Phone
    if (phone === "") {

        document.getElementById("phoneError").textContent =
            "Phone number is required.";

        valid = false;

    } else if (
        !/^\+?\d{7,15}$/.test(phone)
    ) {

        document.getElementById("phoneError").textContent =
            "Enter a valid phone number.";

        valid = false;

    }

    // Date of Birth
    if (dob === "") {

        document.getElementById("dobError").textContent =
            "Date of birth is required.";

        valid = false;

    } else if (
        !/^\d{2}\/\d{2}\/\d{4}$/.test(dob)
    ) {

        document.getElementById("dobError").textContent =
            "Use dd/mm/yyyy format.";

        valid = false;

    }

    // Nationality
    if (nationality === "") {

        document.getElementById("nationalityError").textContent =
            "Please choose your nationality.";

        valid = false;

    }

    // Password
    if (password.length < 8) {

        document.getElementById("passwordError").textContent =
            "Password must contain at least 8 characters.";

        valid = false;

    }

    // Confirm Password
    if (confirmPassword === "") {

        document.getElementById("confirmPasswordError").textContent =
            "Please confirm your password.";

        valid = false;

    } else if (password !== confirmPassword) {

        document.getElementById("confirmPasswordError").textContent =
            "Passwords do not match.";

        valid = false;

    }

    return valid;

}
// ===========================
// SIGNUP SUBMIT
// ===========================

signupForm.addEventListener("submit", async function (e) {

    e.preventDefault();

    if (!validateForm()) return;

    signupBtn.disabled = true;
    signupBtn.textContent = "Creating Account...";

    message.style.display = "none";
    message.className = "";
    message.innerHTML = "";

    const signupData = {

        firstName: signupForm.firstName.value.trim(),

        secondName: signupForm.secondName.value.trim(),

        email: signupForm.email.value.trim(),

        phone: signupForm.phone.value.trim(),

        dob: signupForm.dob.value.trim(),

        nationality: nationalityInput.value.trim(),

        password: signupForm.password.value

    };

    try {

        const response = await fetch("/signup", {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify(signupData)

        });

        const data = await response.json();

        if (response.ok && data.success) {

            message.className = "success";

            message.style.display = "block";

            message.innerHTML = `
                ✅ <b>Account created successfully!</b><br><br>
                Your account has been saved.
                <br><br>
                Redirecting you to the home page...
            `;

            signupForm.reset();

            countrySearch.value = "";

            nationalityInput.value = "";

            setTimeout(() => {
                window.location.href = "/home.html";
            }, 1000);

        } else {

            message.className = "failure";

            message.style.display = "block";

            message.innerHTML =
                data.message ||
                "Unable to create your account.";

        }

    } catch (err) {

        console.error(err);

        message.className = "failure";

        message.style.display = "block";

        message.innerHTML =
            "Unable to connect to the server. Please try again.";

    } finally {

        signupBtn.disabled = false;

        signupBtn.textContent = "Sign Up";

    }

});

const images = [

"https://visitakagera.org/wp-content/uploads/2022/11/our_work_hero2.jpg",

"https://dynamic-media-cdn.tripadvisor.com/media/photo-o/15/26/6d/0c/views-from-the-western.jpg?h=-1&s=1&w=1200",

"https://www.arcadiasafaris.com/wp-content/uploads/2023/08/akagera-1.jpg",

"https://english.news.cn/20230328/f758fd9a2f3c42b1a13f73b6301f70c2/20230328f758fd9a2f3c42b1a13f73b6301f70c2_b6e3ce7a-29c7-4f07-b102-bca1414453cb.jpg",

"https://i.natgeofe.com/n/6bc5f904-553a-48b3-8d82-8fd5e9d20776/MM8382_05-31-15_03819.jpg"

];

const bg1 = document.getElementById("bg1");
const bg2 = document.getElementById("bg2");

let currentImage = 0;

let activeBackground = bg1;
let nextBackground = bg2;

// Load first image immediately
bg1.style.backgroundImage = `url("${images[0]}")`;
bg1.classList.add("visible");

currentImage = 1;

function changeBackground(){

    nextBackground.style.backgroundImage =
        `url("${images[currentImage]}")`;

    nextBackground.classList.add("visible");

    activeBackground.classList.remove("visible");

    const temp = activeBackground;
    activeBackground = nextBackground;
    nextBackground = temp;

    currentImage++;

    if(currentImage >= images.length){

        currentImage = 0;

    }

}

// Change every 6 seconds
setInterval(changeBackground,6000);

</script>
