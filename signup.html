  <meta charset="UTF-8" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-block-size: 100vh;
      padding: 0;
      overflow-y: auto;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1s ease-in-out;
      background-color: #1a1a1a; /* fallback color */
    }
    #welcome {
      background-color: rgba(18, 143, 18, 0.7);
      color: beige;
      block-size: 70px;
      position: relative;
      z-index: 2;
    }

    #logo {
      position: absolute;
      inset-block-start: 4px;
      inset-inline-start: 10px;
      inline-size: 50px;
      block-size:50px;
      border-radius: 100%;
      object-fit: cover;
      border: 2px solid beige;
      background-color: #126f12;
    }

    .center-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      block-size: 100%;
    }

    .center-heading h2 {
      margin: 0;
      font-size: 1.4em;
    }

    #container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-block-start: 40px;
      position: relative;
      z-index: 2;
    }

    form {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      inline-size: 400px;
      color: white;
      position: relative;
    }

    .form-content {
      display: flex;
      flex-direction: column;
    }

    h2 {
      text-align: center;
      margin-block-end: 15px;
      font-size: 1.4em;
      color: #fff;
    }

    label {
      font-weight: bold;
      margin-block-start: 8px;
      font-size: 0.9em;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      inline-size: 100%;
      padding: 8px 35px 8px 8px; /* extra right padding for eye icon */
      margin-block-start: 3px;
      box-sizing: border-box;
      border-radius: 4px;
      border: none;
      outline: none;
      position: relative;
      font-size: 1em;
    }

    .password-wrapper {
      position: relative;
      inline-size: 100%;
    }

    .toggle-password {
      position: absolute;
      inset-block-start: 50%;
      inset-inline-end: 8px;
      transform: translateY(-50%);
      cursor: pointer;
      inline-size: 20px;
      block-size: 20px;
      fill: black;
      opacity: 0.8;
      user-select: none;
    }

    .error {
      color: #ff6666;
      font-size: 0.8em;
      margin-block-end: 3px;
    }

    button {
      margin-block-start: 12px;
      inline-size: 100%;
      padding: 10px;
      background: rgba(255, 165, 0, 0.9);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: rgba(255, 140, 0, 1);
    }

    .country-selector {
      position: relative;
      inline-size: 100%;
      font-size: 0.9em;
    }

    #countrySearch {
      inline-size: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      margin-block-end: 5px;
    }

    .dropdown {
      max-block-size: 150px;
      overflow-y: auto;
      background: white;
      border-radius: 4px;
      border: 1px solid #ccc;
      position: absolute;
      inline-size: 100%;
      display: none;
      z-index: 10;
      color: black;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      padding: 5px;
      cursor: pointer;
      color: black;
    }

    .dropdown-item:hover {
      background: bisque;
    }

    .dropdown-item img {
      inline-size: 18px;
      block-size: 12px;
      margin-inline-end: 8px;
    }

    /* Link for login */
    #loginLink {
      margin-block-start: 15px;
      text-align: center;
      font-size: 0.9em;
    }

    #loginLink a {
      color: #ffa500;
      text-decoration: none;
      font-weight: bold;
    }

    #loginLink a:hover {
      text-decoration: underline;
    }
.bg-image {

  transition: opacity 1.5s ease-in-out;

#bg1 {

            </svg>
          </div>
          <div class="error" id="passwordError"></div>

          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required autocomplete="off" />
            <svg class="toggle-password" data-target="confirmPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

              <circle cx="12" cy="12" r="2.5"/>
            </svg>
          </div>
          <div class="error" id="confirmPasswordError"></div>

          <button type="submit">Sign Up</button>

          <div id="loginLink">
            Already have an account? <a href="login.html">Login here</a>
          </div>
        </div>

    // Country dropdown logic
    const countrySearch = document.getElementById('countrySearch');
    const countryDropdown = document.getElementById('countryDropdown');
    const nationalityInput = document.getElementById('nationality');

    function populateCountries(filter = '') {
      countryDropdown.innerHTML = '';
      const filtered = countries.filter(c =>
        c.name.toLowerCase().includes(filter.toLowerCase())
      );
      filtered.forEach(country => {
        const div = document.createElement('div');
        div.classList.add('dropdown-item');
        div.innerHTML = `<img src="https://flagcdn.com/w20/${country.code}.png" alt="${country.name} flag" /> ${country.name}`;
        div.addEventListener('click', () => {
          countrySearch.value = country.name;
          nationalityInput.value = country.name;
          countryDropdown.style.display = 'none';
        });
        countryDropdown.appendChild(div);
      });
      countryDropdown.style.display = filtered.length ? 'block' : 'none';
    }

    countrySearch.addEventListener('input', () => {
      populateCountries(countrySearch.value);
    });

    countrySearch.addEventListener('focus', () => {
      populateCountries(countrySearch.value);
    });

    document.addEventListener('click', (e) => {
      if (!countrySearch.contains(e.target) && !countryDropdown.contains(e.target)) {
        countryDropdown.style.display = 'none';
      }
    });

    // Password toggle logic
    document.querySelectorAll('.toggle-password').forEach(icon => {
      icon.addEventListener('click', () => {
        const targetId = icon.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (input.type === 'password') {
          input.type = 'text';
          icon.style.fill = '#555'; // Slightly lighter on eye open
        } else {
          input.type = 'password';
          icon.style.fill = 'black';
        }
      });
    });

    // Basic form validation on submit
    const signupForm = document.getElementById('signupForm');

    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();

      // Clear all errors
      ['firstName', 'secondName', 'email', 'phone', 'dob', 'nationality', 'password', 'confirmPassword'].forEach(field => {
        document.getElementById(field + 'Error').textContent = '';
      });

      let hasError = false;

      if (!signupForm.firstName.value.trim()) {
        document.getElementById('firstNameError').textContent = 'First name is required.';
        hasError = true;
      }
      if (!signupForm.secondName.value.trim()) {
        document.getElementById('secondNameError').textContent = 'Second name is required.';
        hasError = true;
      }
      if (!signupForm.email.value.trim()) {
        document.getElementById('emailError').textContent = 'Email is required.';
        hasError = true;
      } else if (!/\S+@\S+\.\S+/.test(signupForm.email.value)) {
        document.getElementById('emailError').textContent = 'Email is invalid.';
        hasError = true;
      }
      if (!signupForm.phone.value.trim()) {
        document.getElementById('phoneError').textContent = 'Phone number is required.';
        hasError = true;
      } else if (!/^\+?\d{7,15}$/.test(signupForm.phone.value.trim())) {
        document.getElementById('phoneError').textContent = 'Phone number is invalid.';
        hasError = true;
      }
      if (!signupForm.dob.value.trim()) {
        document.getElementById('dobError').textContent = 'Date of birth is required.';
        hasError = true;
      } else if (!/^\d{2}\/\d{2}\/\d{4}$/.test(signupForm.dob.value.trim())) {
        document.getElementById('dobError').textContent = 'Date of birth must be in dd/mm/yyyy format.';
        hasError = true;
      }
      if (!signupForm.nationality.value.trim()) {
        document.getElementById('nationalityError').textContent = 'Please select your nationality.';
        hasError = true;
      }
      if (!signupForm.password.value.trim()) {
        document.getElementById('passwordError').textContent = 'Password is required.';
        hasError = true;
      } else if (signupForm.password.value.length < 8) {
        document.getElementById('passwordError').textContent = 'Password must be at least 8 characters.';
        hasError = true;
      }
      if (!signupForm.confirmPassword.value.trim()) {
        document.getElementById('confirmPasswordError').textContent = 'Please confirm your password.';
        hasError = true;
      } else if (signupForm.password.value !== signupForm.confirmPassword.value) {
        document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
        hasError = true;
      }

      if (hasError) return;

      // Submit form data to server here (example fetch)
      const signupData = {
        firstName: signupForm.firstName.value.trim(),
        secondName: signupForm.secondName.value.trim(),
        email: signupForm.email.value.trim(),
        phone: signupForm.phone.value.trim(),
        dob: signupForm.dob.value.trim(),
        nationality: signupForm.nationality.value.trim(),
        password: signupForm.password.value,
      };
fetch('/signup', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify(signupData)
})
.then(async res => {
  const data = await res.json();

  if (res.ok) {
    alert(data.message);
    signupForm.reset();
    nationalityInput.value = '';
    countrySearch.value = '';
  } else {
    alert(data.message);
  }
})
.catch(err => {
  console.error(err);
  alert('Error connecting to server.');
});

  const nextImage = images[current];

  const fadeInDiv = showingFirst ? bg2 : bg1;

  fadeInDiv.style.backgroundImage = `url('${nextImage}')`;
  fadeInDiv.classList.add('visible');
  fadeOutDiv.classList.remove('visible');

  showingFirst = !showingFirst;
  current = (current + 1) % images.length;
}

changeBackground();
setInterval(changeBackground, 8000);

  </script>
</body>
