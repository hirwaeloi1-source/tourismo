<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tourismo | Gallery</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f4f7f4;

    color:
        #222;

    min-height:
        100vh;
}


/* =========================
   HEADER
========================= */

header {

    height: 70px;

    background:
        #157a1f;

    display:
        flex;

    align-items:
        center;

    padding:
        0 25px;

    color:
        white;

    position:
        sticky;

    top: 0;

    z-index: 1000;

    box-shadow:
        0 2px 10px rgba(0,0,0,.15);
}


.logo {

    width:
        48px;

    height:
        48px;

    border-radius:
        50%;

    object-fit:
        cover;

    border:
        2px solid white;

    margin-right:
        15px;
}


header h1 {

    font-size:
        21px;

    letter-spacing:
        .5px;
}


.back-btn {

    margin-left:
        auto;

    background:
        rgba(255,255,255,.15);

    color:
        white;

    border:
        1px solid rgba(255,255,255,.35);

    padding:
        9px 16px;

    border-radius:
        7px;

    cursor:
        pointer;

    text-decoration:
        none;

    font-size:
        14px;

    transition:
        .2s;
}


.back-btn:hover {

    background:
        rgba(255,255,255,.25);
}


/* =========================
   MAIN
========================= */

main {

    width:
        min(1200px, 94%);

    margin:
        30px auto 50px;
}


/* =========================
   PAGE TITLE
========================= */

.page-title {

    text-align:
        center;

    margin-bottom:
        25px;
}


.page-title h2 {

    font-size:
        30px;

    color:
        #157a1f;

    margin-bottom:
        8px;
}


.page-title p {

    color:
        #666;

    font-size:
        15px;
}


/* =========================
   FILTER AREA
========================= */

.filters {

    background:
        white;

    border-radius:
        14px;

    padding:
        18px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.08);

    margin-bottom:
        25px;

    display:
        flex;

    gap:
        12px;

    flex-wrap:
        wrap;

    align-items:
        center;
}


.search-box {

    flex:
        1;

    min-width:
        220px;

    position:
        relative;
}


.search-box input {

    width:
        100%;

    border:
        1px solid #ddd;

    border-radius:
        9px;

    padding:
        11px 14px;

    outline:
        none;

    font-size:
        14px;
}


.search-box input:focus {

    border-color:
        #157a1f;

    box-shadow:
        0 0 0 3px rgba(21,122,31,.08);
}


.filter-select {

    min-width:
        170px;

    padding:
        11px 12px;

    border:
        1px solid #ddd;

    border-radius:
        9px;

    background:
        white;

    color:
        #333;

    outline:
        none;

    cursor:
        pointer;

    font-size:
        14px;
}


.filter-select:focus {

    border-color:
        #157a1f;
}


.clear-btn {

    border:
        none;

    background:
        #157a1f;

    color:
        white;

    padding:
        11px 16px;

    border-radius:
        9px;

    cursor:
        pointer;

    font-size:
        14px;
}


.clear-btn:hover {

    background:
        #11651a;
}


/* =========================
   GALLERY GRID
========================= */

.gallery-grid {

    display:
        grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        18px;
}


/* =========================
   GALLERY CARD
========================= */

.gallery-card {

    background:
        white;

    border-radius:
        13px;

    overflow:
        hidden;

    box-shadow:
        0 3px 14px rgba(0,0,0,.08);

    cursor:
        pointer;

    transition:
        transform .2s,
        box-shadow .2s;

    position:
        relative;
}


.gallery-card:hover {

    transform:
        translateY(-4px);

    box-shadow:
        0 8px 22px rgba(0,0,0,.14);
}


/* =========================
   IMAGE
========================= */

.gallery-image {

    width:
        100%;

    height:
        230px;

    object-fit:
        cover;

    display:
        block;

    background:
        #ddd;

    transition:
        transform .3s;
}


.gallery-card:hover
.gallery-image {

    transform:
        scale(1.04);
}


/* =========================
   CARD INFO
========================= */

.gallery-info {

    padding:
        13px;
}


.gallery-title {

    font-weight:
        bold;

    font-size:
        16px;

    margin-bottom:
        5px;
}


.gallery-location {

    color:
        #777;

    font-size:
        13px;

    margin-bottom:
        7px;
}


.gallery-category {

    display:
        inline-block;

    background:
        #e9f5ea;

    color:
        #157a1f;

    padding:
        4px 8px;

    border-radius:
        20px;

    font-size:
        11px;

    font-weight:
        bold;
}


/* =========================
   EMPTY STATE
========================= */

.empty-state {

    display:
        none;

    background:
        white;

    border-radius:
        14px;

    padding:
        50px 20px;

    text-align:
        center;

    box-shadow:
        0 3px 15px rgba(0,0,0,.08);
}


.empty-state h3 {

    color:
        #555;

    margin-bottom:
        8px;
}


.empty-state p {

    color:
        #888;

    font-size:
        14px;
}


/* =========================
   LOADING
========================= */

.loading {

    text-align:
        center;

    padding:
        60px 20px;

    color:
        #777;

    font-size:
        15px;
}


/* =========================
   ERROR
========================= */

.error-message {

    display:
        none;

    background:
        #fff0f0;

    color:
        #b00020;

    border-radius:
        10px;

    padding:
        15px;

    margin-bottom:
        20px;

    text-align:
        center;
}


/* =========================
   LIGHTBOX
========================= */

.lightbox {

    display:
        none;

    position:
        fixed;

    inset:
        0;

    background:
        rgba(0,0,0,.92);

    z-index:
        3000;

    align-items:
        center;

    justify-content:
        center;

    padding:
        30px;
}


.lightbox.active {

    display:
        flex;
}


.lightbox-image {

    max-width:
        90vw;

    max-height:
        82vh;

    object-fit:
        contain;

    border-radius:
        6px;

    user-select:
        none;
}


.lightbox-close {

    position:
        absolute;

    top:
        18px;

    right:
        25px;

    border:
        none;

    background:
        rgba(255,255,255,.15);

    color:
        white;

    width:
        42px;

    height:
        42px;

    border-radius:
        50%;

    font-size:
        25px;

    cursor:
        pointer;
}


.lightbox-close:hover {

    background:
        rgba(255,255,255,.25);
}


.lightbox-prev,
.lightbox-next {

    position:
        absolute;

    top:
        50%;

    transform:
        translateY(-50%);

    border:
        none;

    background:
        rgba(255,255,255,.15);

    color:
        white;

    width:
        48px;

    height:
        48px;

    border-radius:
        50%;

    font-size:
        25px;

    cursor:
        pointer;
}


.lightbox-prev {

    left:
        20px;
}


.lightbox-next {

    right:
        20px;
}


.lightbox-prev:hover,
.lightbox-next:hover {

    background:
        rgba(255,255,255,.28);
}


/* =========================
   LIGHTBOX INFO
========================= */

.lightbox-info {

    position:
        absolute;

    bottom:
        20px;

    left:
        50%;

    transform:
        translateX(-50%);

    color:
        white;

    text-align:
        center;

    max-width:
        80%;

    background:
        rgba(0,0,0,.45);

    padding:
        10px 18px;

    border-radius:
        8px;
}


.lightbox-title {

    font-weight:
        bold;

    font-size:
        16px;
}


.lightbox-location {

    font-size:
        13px;

    color:
        #ddd;

    margin-top:
        3px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:1000px) {

    .gallery-grid {

        grid-template-columns:
            repeat(3, 1fr);

    }

}


@media(max-width:700px) {

    header {

        padding:
            0 15px;

    }

    header h1 {

        font-size:
            18px;

    }

    main {

        width:
            96%;

        margin-top:
            20px;

    }

    .page-title h2 {

        font-size:
            25px;

    }

    .gallery-grid {

        grid-template-columns:
            repeat(2, 1fr);

        gap:
            12px;

    }

    .gallery-image {

        height:
            180px;

    }

    .filters {

        padding:
            14px;

    }

    .search-box {

        min-width:
            100%;

    }

    .filter-select {

        flex:
            1;

        min-width:
            0;

    }

}


@media(max-width:450px) {

    .gallery-grid {

        grid-template-columns:
            1fr;

    }

    .gallery-image {

        height:
            240px;

    }

    .lightbox {

        padding:
            10px;

    }

    .lightbox-image {

        max-width:
            96vw;

        max-height:
            78vh;

    }

    .lightbox-prev {

        left:
            8px;

    }

    .lightbox-next {

        right:
            8px;

    }

}

</style>

</head>
<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <img
        src="logo.jpeg"
        class="logo"
        alt="Tourismo"
    >

    <h1>
        Tourismo
    </h1>

    <a
        href="home.html"
        class="back-btn"
    >
        ← Home
    </a>

</header>


<!-- =========================
     MAIN
========================= -->

<main>

    <!-- PAGE TITLE -->

    <div class="page-title">

        <h2>
            Travel Gallery
        </h2>

        <p>
            Explore beautiful destinations from around the world.
        </p>

    </div>


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="error-message"
    >
        Unable to load the gallery.
    </div>


    <!-- =========================
         FILTERS
    ========================= -->

    <div class="filters">

        <div class="search-box">

            <input
                type="search"
                id="searchInput"
                placeholder="Search destinations..."
                autocomplete="off"
            >

        </div>


        <select
            id="countryFilter"
            class="filter-select"
        >

            <option value="">
                All Countries
            </option>

        </select>


        <select
            id="categoryFilter"
            class="filter-select"
        >

            <option value="">
                All Categories
            </option>

        </select>


        <button
            type="button"
            id="clearFilters"
            class="clear-btn"
        >
            Clear Filters
        </button>

    </div>


    <!-- =========================
         LOADING
    ========================= -->

    <div
        id="loading"
        class="loading"
    >
        Loading gallery...
    </div>


    <!-- =========================
         GALLERY
    ========================= -->

    <div
        id="galleryGrid"
        class="gallery-grid"
    ></div>


    <!-- =========================
         EMPTY STATE
    ========================= -->

    <div
        id="emptyState"
        class="empty-state"
    >

        <h3>
            No photos found
        </h3>

        <p>
            Try changing your search or filters.
        </p>

    </div>

</main>


<!-- =========================
     LIGHTBOX
========================= -->

<div
    id="lightbox"
    class="lightbox"
>

    <button
        id="lightboxClose"
        class="lightbox-close"
        type="button"
        aria-label="Close"
    >
        ×
    </button>


    <button
        id="lightboxPrev"
        class="lightbox-prev"
        type="button"
        aria-label="Previous image"
    >
        ‹
    </button>


    <img
        id="lightboxImage"
        class="lightbox-image"
        src=""
        alt="Gallery image"
    >


    <button
        id="lightboxNext"
        class="lightbox-next"
        type="button"
        aria-label="Next image"
    >
        ›
    </button>


    <div class="lightbox-info">

        <div
            id="lightboxTitle"
            class="lightbox-title"
        >
            Photo
        </div>

        <div
            id="lightboxLocation"
            class="lightbox-location"
        >
        </div>

    </div>

</div>


<script>

// ===============================
// ELEMENTS
// ===============================

const galleryGrid =
    document.getElementById(
        "galleryGrid"
    );

const loading =
    document.getElementById(
        "loading"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const countryFilter =
    document.getElementById(
        "countryFilter"
    );

const categoryFilter =
    document.getElementById(
        "categoryFilter"
    );

const clearFilters =
    document.getElementById(
        "clearFilters"
    );


// ===============================
// LIGHTBOX ELEMENTS
// ===============================

const lightbox =
    document.getElementById(
        "lightbox"
    );

const lightboxImage =
    document.getElementById(
        "lightboxImage"
    );

const lightboxTitle =
    document.getElementById(
        "lightboxTitle"
    );

const lightboxLocation =
    document.getElementById(
        "lightboxLocation"
    );

const lightboxClose =
    document.getElementById(
        "lightboxClose"
    );

const lightboxPrev =
    document.getElementById(
        "lightboxPrev"
    );

const lightboxNext =
    document.getElementById(
        "lightboxNext"
    );


// ===============================
// DATA
// ===============================

let allPhotos = [];

let filteredPhotos = [];

let currentPhotoIndex = 0;


// ===============================
// ESCAPE HTML
// ===============================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ===============================
// NORMALIZE PHOTO
// ===============================

function normalizePhoto(photo) {

    return {

        id:
            photo._id ||
            photo.id ||
            crypto.randomUUID(),

        title:
            photo.title ||
            photo.name ||
            "Untitled Photo",

        location:
            photo.location ||
            photo.destination ||
            "",

        country:
            photo.country ||
            "",

        category:
            photo.category ||
            "Other",

        image:
            photo.image ||
            photo.imageUrl ||
            photo.url ||
            photo.photoUrl ||
            "",

        description:
            photo.description ||
            ""

    };

}


// ===============================
// LOAD GALLERY
// ===============================

async function loadGallery() {

    loading.style.display =
        "block";

    galleryGrid.innerHTML =
        "";

    emptyState.style.display =
        "none";

    errorMessage.style.display =
        "none";


    try {

        const response =
            await fetch(
                "/api/gallery",
                {
                    method: "GET"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        /*
         * Accept:
         *
         * {
         *   success: true,
         *   photos: [...]
         * }
         *
         * OR
         *
         * {
         *   gallery: [...]
         * }
         *
         * OR
         *
         * [...]
         */

        let photos =
            data.photos ||
            data.gallery ||
            data.data ||
            data;


        if (!Array.isArray(photos)) {

            photos = [];

        }


        allPhotos =
            photos
                .map(normalizePhoto)
                .filter(photo =>
                    photo.image
                );


        createFilters();

        applyFilters();


    }

    catch (error) {

        console.error(
            "❌ GALLERY LOAD ERROR:",
            error
        );


        errorMessage.textContent =
            "Unable to load the gallery. Please try again.";

        errorMessage.style.display =
            "block";


        allPhotos = [];

        filteredPhotos = [];

        renderGallery();

    }

    finally {

        loading.style.display =
            "none";

    }

}


// ===============================
// CREATE FILTER OPTIONS
// ===============================

function createFilters() {

    const countries =
        [
            ...new Set(
                allPhotos
                    .map(photo =>
                        photo.country
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    const categories =
        [
            ...new Set(
                allPhotos
                    .map(photo =>
                        photo.category
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    countryFilter.innerHTML = `

        <option value="">
            All Countries
        </option>

    `;


    categoryFilter.innerHTML = `

        <option value="">
            All Categories
        </option>

    `;


    countries.forEach(country => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            country;

        option.textContent =
            country;

        countryFilter.appendChild(
            option
        );

    });


    categories.forEach(category => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            category;

        option.textContent =
            category;

        categoryFilter.appendChild(
            option
        );

    });

}


// ===============================
// APPLY FILTERS
// ===============================

function applyFilters() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const country =
        countryFilter.value
            .toLowerCase();


    const category =
        categoryFilter.value
            .toLowerCase();


    filteredPhotos =
        allPhotos.filter(photo => {

            const title =
                photo.title
                    .toLowerCase();

            const location =
                photo.location
                    .toLowerCase();

            const photoCountry =
                photo.country
                    .toLowerCase();

            const photoCategory =
                photo.category
                    .toLowerCase();


            const matchesSearch =
                !search ||
                title.includes(search) ||
                location.includes(search) ||
                photoCountry.includes(search);


            const matchesCountry =
                !country ||
                photoCountry === country;


            const matchesCategory =
                !category ||
                photoCategory === category;


            return (
                matchesSearch &&
                matchesCountry &&
                matchesCategory
            );

        });


    renderGallery();

}


// ===============================
// RENDER GALLERY
// ===============================

function renderGallery() {

    galleryGrid.innerHTML =
        "";


    if (!filteredPhotos.length) {

        emptyState.style.display =
            "block";

        return;

    }


    emptyState.style.display =
        "none";


    filteredPhotos.forEach(
        (photo, index) => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "gallery-card";


            card.innerHTML = `

                <img
                    class="gallery-image"
                    src="${escapeHtml(photo.image)}"
                    alt="${escapeHtml(photo.title)}"
                    loading="lazy"
                >

                <div class="gallery-info">

                    <div class="gallery-title">
                        ${escapeHtml(photo.title)}
                    </div>

                    <div class="gallery-location">
                        ${escapeHtml(
                            photo.location ||
                            photo.country ||
                            "Travel destination"
                        )}
                    </div>

                    <span class="gallery-category">
                        ${escapeHtml(photo.category)}
                    </span>

                </div>

            `;


            const image =
                card.querySelector(
                    ".gallery-image"
                );


            image.addEventListener(
                "error",
                () => {

                    image.src =
                        "logo.jpeg";

                }
            );


            card.addEventListener(
                "click",
                () => {

                    openLightbox(index);

                }
            );


            galleryGrid.appendChild(
                card
            );

        }
    );

}


// ===============================
// OPEN LIGHTBOX
// ===============================

function openLightbox(index) {

    if (
        !filteredPhotos.length
    ) {

        return;

    }


    currentPhotoIndex =
        index;


    updateLightbox();


    lightbox.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


// ===============================
// UPDATE LIGHTBOX
// ===============================

function updateLightbox() {

    const photo =
        filteredPhotos[
            currentPhotoIndex
        ];


    if (!photo) {

        return;

    }


    lightboxImage.src =
        photo.image;


    lightboxImage.alt =
        photo.title;


    lightboxTitle.textContent =
        photo.title;


    lightboxLocation.textContent =
        [
            photo.location,
            photo.country
        ]
        .filter(Boolean)
        .join(" • ");

}


// ===============================
// CLOSE LIGHTBOX
// ===============================

function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );


    lightboxImage.src =
        "";


    document.body.style.overflow =
        "";

}


// ===============================
// PREVIOUS PHOTO
// ===============================

function previousPhoto() {

    if (
        !filteredPhotos.length
    ) {

        return;

    }


    currentPhotoIndex--;

    if (
        currentPhotoIndex < 0
    ) {

        currentPhotoIndex =
            filteredPhotos.length - 1;

    }


    updateLightbox();

}


// ===============================
// NEXT PHOTO
// ===============================

function nextPhoto() {

    if (
        !filteredPhotos.length
    ) {

        return;

    }


    currentPhotoIndex++;

    if (
        currentPhotoIndex >=
        filteredPhotos.length
    ) {

        currentPhotoIndex =
            0;

    }


    updateLightbox();

}


// ===============================
// FILTER EVENTS
// ===============================

searchInput.addEventListener(
    "input",
    applyFilters
);


countryFilter.addEventListener(
    "change",
    applyFilters
);


categoryFilter.addEventListener(
    "change",
    applyFilters
);


// ===============================
// CLEAR FILTERS
// ===============================

clearFilters.addEventListener(
    "click",
    () => {

        searchInput.value =
            "";

        countryFilter.value =
            "";

        categoryFilter.value =
            "";

        applyFilters();

    }
);


// ===============================
// LIGHTBOX EVENTS
// ===============================

lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightboxPrev.addEventListener(
    "click",
    previousPhoto
);


lightboxNext.addEventListener(
    "click",
    nextPhoto
);


// ===============================
// CLICK OUTSIDE IMAGE
// ===============================

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            lightbox
        ) {

            closeLightbox();

        }

    }
);


// ===============================
// KEYBOARD CONTROLS
// ===============================

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key ===
            "Escape"
        ) {

            closeLightbox();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousPhoto();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextPhoto();

        }

    }
);


// ===============================
// INITIALIZE
// ===============================

loadGallery();

</script>

</body>

</html>
