<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tourismo | Trips</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f4f7f4;

    color:
        #222;

    min-height:
        100vh;
}


/* =========================
   HEADER
========================= */

header {

    height: 70px;

    background:
        #157a1f;

    color:
        white;

    display:
        flex;

    align-items:
        center;

    padding:
        0 25px;

    position:
        sticky;

    top: 0;

    z-index: 1000;

    box-shadow:
        0 2px 10px rgba(0,0,0,.15);
}


.logo {

    width:
        48px;

    height:
        48px;

    border-radius:
        50%;

    object-fit:
        cover;

    border:
        2px solid white;

    margin-right:
        14px;
}


header h1 {

    font-size:
        21px;
}


.back-btn {

    margin-left:
        auto;

    color:
        white;

    text-decoration:
        none;

    background:
        rgba(255,255,255,.15);

    border:
        1px solid rgba(255,255,255,.35);

    padding:
        9px 15px;

    border-radius:
        7px;

    font-size:
        14px;
}


/* =========================
   MAIN
========================= */

main {

    width:
        min(1100px, 94%);

    margin:
        30px auto 60px;
}


/* =========================
   PAGE TITLE
========================= */

.page-title {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        15px;

    margin-bottom:
        25px;
}


.page-title h2 {

    font-size:
        28px;

    color:
        #157a1f;
}


.create-btn {

    border:
        none;

    background:
        #157a1f;

    color:
        white;

    padding:
        12px 18px;

    border-radius:
        8px;

    cursor:
        pointer;

    font-weight:
        bold;

    font-size:
        14px;
}


.create-btn:hover {

    background:
        #0f6118;
}


/* =========================
   TABS
========================= */

.tabs {

    display:
        flex;

    gap:
        8px;

    margin-bottom:
        22px;

    border-bottom:
        1px solid #ddd;

    overflow-x:
        auto;
}


.tab {

    border:
        none;

    background:
        transparent;

    padding:
        12px 18px;

    cursor:
        pointer;

    font-size:
        15px;

    color:
        #666;

    border-bottom:
        3px solid transparent;

    white-space:
        nowrap;
}


.tab.active {

    color:
        #157a1f;

    border-bottom-color:
        #157a1f;

    font-weight:
        bold;
}


/* =========================
   SEARCH
========================= */

.search-row {

    display:
        flex;

    gap:
        10px;

    margin-bottom:
        25px;
}


.search-input {

    flex:
        1;

    padding:
        12px 15px;

    border:
        1px solid #ddd;

    border-radius:
        8px;

    outline:
        none;

    font-size:
        14px;
}


.search-input:focus {

    border-color:
        #157a1f;
}


/* =========================
   TRIPS GRID
========================= */

.trips-grid {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        20px;
}


/* =========================
   TRIP CARD
========================= */

.trip-card {

    background:
        white;

    border-radius:
        14px;

    overflow:
        hidden;

    box-shadow:
        0 3px 15px rgba(0,0,0,.09);

    transition:
        transform .2s,
        box-shadow .2s;
}


.trip-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 6px 20px rgba(0,0,0,.13);
}


.trip-image {

    width:
        100%;

    height:
        190px;

    object-fit:
        cover;

    display:
        block;

    background:
        #ddd;
}


.trip-content {

    padding:
        17px;
}


.trip-title {

    font-size:
        19px;

    font-weight:
        bold;

    margin-bottom:
        8px;

    color:
        #222;
}


.trip-destination {

    color:
        #157a1f;

    font-weight:
        bold;

    font-size:
        14px;

    margin-bottom:
        10px;
}


.trip-info {

    display:
        flex;

    flex-direction:
        column;

    gap:
        7px;

    color:
        #666;

    font-size:
        13px;

    margin-bottom:
        15px;
}


.trip-description {

    font-size:
        14px;

    line-height:
        1.5;

    color:
        #555;

    margin-bottom:
        15px;
}


.trip-footer {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;
}


.join-btn {

    border:
        none;

    background:
        #157a1f;

    color:
        white;

    padding:
        9px 15px;

    border-radius:
        7px;

    cursor:
        pointer;

    font-weight:
        bold;
}


.join-btn.joined {

    background:
        #e7f3e8;

    color:
        #157a1f;

    border:
        1px solid #b9dcbc;
}


.join-btn:hover {

    opacity:
        .9;
}


.members {

    color:
        #777;

    font-size:
        12px;
}


/* =========================
   CREATE TRIP MODAL
========================= */

.modal-overlay {

    position:
        fixed;

    inset:
        0;

    background:
        rgba(0,0,0,.55);

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    z-index:
        2000;
}


.modal-overlay.active {

    display:
        flex;
}


.modal {

    width:
        min(600px, 100%);

    max-height:
        92vh;

    overflow-y:
        auto;

    background:
        white;

    border-radius:
        15px;

    padding:
        25px;
}


.modal-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        20px;
}


.modal-header h3 {

    font-size:
        22px;

    color:
        #157a1f;
}


.close-btn {

    border:
        none;

    background:
        transparent;

    font-size:
        26px;

    cursor:
        pointer;

    color:
        #666;
}


/* =========================
   FORM
========================= */

.form-group {

    margin-bottom:
        15px;
}


.form-group label {

    display:
        block;

    font-size:
        13px;

    font-weight:
        bold;

    margin-bottom:
        6px;
}


.form-group input,
.form-group textarea,
.form-group select {

    width:
        100%;

    padding:
        11px 12px;

    border:
        1px solid #ddd;

    border-radius:
        7px;

    outline:
        none;

    font-size:
        14px;

    font-family:
        inherit;
}


.form-group textarea {

    resize:
        vertical;

    min-height:
        90px;
}


.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {

    border-color:
        #157a1f;
}


.form-row {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        12px;
}


.submit-trip-btn {

    width:
        100%;

    border:
        none;

    background:
        #157a1f;

    color:
        white;

    padding:
        13px;

    border-radius:
        8px;

    cursor:
        pointer;

    font-weight:
        bold;

    font-size:
        15px;

    margin-top:
        5px;
}


/* =========================
   EMPTY STATE
========================= */

.empty-state {

    grid-column:
        1 / -1;

    text-align:
        center;

    background:
        white;

    border-radius:
        12px;

    padding:
        50px 20px;

    color:
        #777;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}


.empty-state h3 {

    color:
        #333;

    margin-bottom:
        8px;
}


.empty-state p {

    font-size:
        14px;

    line-height:
        1.5;
}


/* =========================
   LOADING
========================= */

.loading {

    grid-column:
        1 / -1;

    text-align:
        center;

    padding:
        50px;

    color:
        #777;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px) {

    .trips-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


@media(max-width:600px) {

    header {

        padding:
            0 15px;

    }


    header h1 {

        font-size:
            18px;

    }


    main {

        width:
            94%;

        margin-top:
            20px;

    }


    .page-title {

        align-items:
            flex-start;

        flex-direction:
            column;

    }


    .page-title h2 {

        font-size:
            24px;

    }


    .create-btn {

        width:
            100%;

    }


    .trips-grid {

        grid-template-columns:
            1fr;

    }


    .form-row {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <img
        src="logo.jpeg"
        class="logo"
        alt="Tourismo"
    >

    <h1>
        Tourismo
    </h1>

    <a
        href="home.html"
        class="back-btn"
    >
        ← Home
    </a>

</header>


<!-- =========================
     MAIN
========================= -->

<main>


    <div class="page-title">

        <h2>
            ✈️ Trips
        </h2>

        <button
            id="openCreateBtn"
            class="create-btn"
            type="button"
        >
            + Create a Trip
        </button>

    </div>


    <!-- =====================
         TABS
    ====================== -->

    <div class="tabs">

        <button
            class="tab active"
            data-tab="upcoming"
            type="button"
        >
            Upcoming Trips
        </button>

        <button
            class="tab"
            data-tab="joined"
            type="button"
        >
            Joined Trips
        </button>

        <button
            class="tab"
            data-tab="created"
            type="button"
        >
            My Trips
        </button>

    </div>


    <!-- =====================
         SEARCH
    ====================== -->

    <div class="search-row">

        <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search trips or destinations..."
        >

    </div>


    <!-- =====================
         TRIPS
    ====================== -->

    <section
        id="tripsGrid"
        class="trips-grid"
    >

        <div class="loading">
            Loading trips...
        </div>

    </section>

</main>


<!-- =========================
     CREATE TRIP MODAL
========================= -->

<div
    id="createModal"
    class="modal-overlay"
>

    <div class="modal">


        <div class="modal-header">

            <h3>
                Create a Trip
            </h3>

            <button
                id="closeModalBtn"
                class="close-btn"
                type="button"
            >
                ×
            </button>

        </div>


        <form id="createTripForm">


            <div class="form-group">

                <label for="tripTitle">
                    Trip title
                </label>

                <input
                    id="tripTitle"
                    name="title"
                    type="text"
                    placeholder="e.g. Weekend in Kigali"
                    required
                    maxlength="100"
                >

            </div>


            <div class="form-group">

                <label for="destination">
                    Destination
                </label>

                <input
                    id="destination"
                    name="destination"
                    type="text"
                    placeholder="e.g. Kigali, Rwanda"
                    required
                    maxlength="100"
                >

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="startDate">
                        Start date
                    </label>

                    <input
                        id="startDate"
                        name="startDate"
                        type="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="endDate">
                        End date
                    </label>

                    <input
                        id="endDate"
                        name="endDate"
                        type="date"
                        required
                    >

                </div>


            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="maxMembers">
                        Maximum travelers
                    </label>

                    <input
                        id="maxMembers"
                        name="maxMembers"
                        type="number"
                        min="1"
                        max="1000"
                        value="10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="tripType">
                        Trip type
                    </label>

                    <select
                        id="tripType"
                        name="tripType"
                    >

                        <option value="Adventure">
                            Adventure
                        </option>

                        <option value="Relaxation">
                            Relaxation
                        </option>

                        <option value="Culture">
                            Culture
                        </option>

                        <option value="Business">
                            Business
                        </option>

                        <option value="Family">
                            Family
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


            </div>


            <div class="form-group">

                <label for="tripImage">
                    Image URL
                </label>

                <input
                    id="tripImage"
                    name="image"
                    type="url"
                    placeholder="https://..."
                >

            </div>


            <div class="form-group">

                <label for="tripDescription">
                    Description
                </label>

                <textarea
                    id="tripDescription"
                    name="description"
                    placeholder="Tell travelers about your trip..."
                    maxlength="1000"
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-trip-btn"
            >
                Create Trip
            </button>


        </form>

    </div>

</div>


<script>
    <script>

// ===============================
// STATE
// ===============================

let currentUser = null;

let allTrips = [];

let currentTab = "upcoming";


// ===============================
// ELEMENTS
// ===============================

const tripsGrid =
    document.getElementById("tripsGrid");

const searchInput =
    document.getElementById("searchInput");

const tabs =
    document.querySelectorAll(".tab");

const createModal =
    document.getElementById("createModal");

const openCreateBtn =
    document.getElementById("openCreateBtn");

const closeModalBtn =
    document.getElementById("closeModalBtn");

const createTripForm =
    document.getElementById("createTripForm");


// ===============================
// LOAD CURRENT USER
// ===============================

async function loadCurrentUser() {

    try {

        const response =
            await fetch("/me", {
                method: "GET",
                credentials: "include"
            });


        if (!response.ok) {

            currentUser = null;

            return;

        }


        const data =
            await response.json();

if (data.success && data.user) {

    currentUser = data.user;

} else {

    currentUser = data;

}

    }

    catch (error) {

        console.error(
            "❌ USER LOAD ERROR:",
            error
        );

        currentUser = null;

    }

}


// ===============================
// LOAD TRIPS
// ===============================

async function loadTrips() {

    tripsGrid.innerHTML = `

        <div class="loading">
            Loading trips...
        </div>

    `;


    try {

        /*
         * Expected backend endpoint:
         *
         * GET /trips
         */

        const response =
            await fetch("/trips", {
                method: "GET",
                credentials: "include"
            });


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        allTrips =
            data.trips ||
            data.data ||
            [];


        renderTrips();

    }

    catch (error) {

        console.error(
            "❌ TRIPS LOAD ERROR:",
            error
        );


        tripsGrid.innerHTML = `

            <div class="empty-state">

                <h3>
                    Unable to load trips
                </h3>

                <p>
                    Please try again later.
                </p>

            </div>

        `;

    }

}


// ===============================
// GET TRIP DATE
// ===============================

function getTripDate(trip) {

    return new Date(
        trip.startDate ||
        trip.date ||
        trip.createdAt
    );

}


// ===============================
// CHECK IF USER JOINED
// ===============================

function isUserJoined(trip) {

    if (!currentUser) {

        return false;

    }


    const currentId =
        String(
            currentUser._id ||
            currentUser.id ||
            currentUser.email
        );


    const members =
        trip.members ||
        trip.joinedUsers ||
        trip.participants ||
        [];


    return members.some(member => {

        const memberId =
            member._id ||
            member.id ||
            member.email ||
            member;


        return String(memberId) ===
            currentId;

    });

}


// ===============================
// CHECK IF USER CREATED TRIP
// ===============================

function isUserCreator(trip) {

    if (!currentUser) {

        return false;

    }


    const creator =
        trip.creator ||
        trip.createdBy ||
        trip.owner ||
        {};


    const creatorId =
        creator._id ||
        creator.id ||
        creator.email ||
        trip.creatorId;


    const currentId =
        currentUser._id ||
        currentUser.id ||
        currentUser.email;


    return (
        creatorId &&
        currentId &&
        String(creatorId) ===
        String(currentId)
    );

}


// ===============================
// FILTER TRIPS
// ===============================

function getFilteredTrips() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const now =
        new Date();


    let filtered =
        allTrips.filter(trip => {

            const tripDate =
                getTripDate(trip);


            // Upcoming trips

            if (
                currentTab ===
                "upcoming"
            ) {

                return (
                    !Number.isNaN(
                        tripDate.getTime()
                    ) &&
                    tripDate >= now
                );

            }


            // Joined trips

            if (
                currentTab ===
                "joined"
            ) {

                return isUserJoined(
                    trip
                );

            }


            // Created trips

            if (
                currentTab ===
                "created"
            ) {

                return isUserCreator(
                    trip
                );

            }


            return true;

        });


    // Search

    if (search) {

        filtered =
            filtered.filter(trip => {

                const text = [

                    trip.title,

                    trip.destination,

                    trip.description,

                    trip.tripType,

                    trip.type

                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                return text.includes(
                    search
                );

            });

    }


    return filtered;

}


// ===============================
// RENDER TRIPS
// ===============================

function renderTrips() {

    const trips =
        getFilteredTrips();


    tripsGrid.innerHTML =
        "";


    if (!trips.length) {

        let message =
            "No trips found.";


        if (
            currentTab ===
            "upcoming"
        ) {

            message =
                "There are no upcoming trips yet.";

        }


        if (
            currentTab ===
            "joined"
        ) {

            message =
                "You haven't joined any trips yet.";

        }


        if (
            currentTab ===
            "created"
        ) {

            message =
                "You haven't created any trips yet.";

        }


        tripsGrid.innerHTML = `

            <div class="empty-state">

                <h3>
                    ✈️ No trips
                </h3>

                <p>
                    ${message}
                </p>

            </div>

        `;

        return;

    }


    trips.forEach(trip => {

        tripsGrid.appendChild(
            createTripCard(trip)
        );

    });

}


// ===============================
// CREATE TRIP CARD
// ===============================

function createTripCard(trip) {

    const card =
        document.createElement("article");


    card.className =
        "trip-card";


    const title =
        trip.title ||
        "Untitled Trip";


    const destination =
        trip.destination ||
        "Unknown destination";


    const description =
        trip.description ||
        "No description provided.";


    const image =
        trip.image ||
        trip.imageUrl ||
        trip.coverImage ||
        "logo.jpeg";


    const startDate =
        trip.startDate ||
        trip.date;


    const endDate =
        trip.endDate;


    const type =
        trip.tripType ||
        trip.type ||
        "Travel";


    const members =
        trip.members ||
        trip.joinedUsers ||
        trip.participants ||
        [];


    const maxMembers =
        Number(
            trip.maxMembers ||
            trip.capacity ||
            0
        );


    const memberCount =
        members.length;


    const joined =
        isUserJoined(
            trip
        );


    const creator =
        isUserCreator(
            trip
        );


    card.innerHTML = `

        <img
            class="trip-image"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(destination)}"
        >


        <div class="trip-content">

            <div class="trip-title">

                ${escapeHtml(title)}

            </div>


            <div class="trip-destination">

                📍 ${escapeHtml(destination)}

            </div>


            <div class="trip-info">

                <span>
                    📅 ${formatDate(
                        startDate
                    )}${endDate
                        ? ` — ${formatDate(endDate)}`
                        : ""
                    }
                </span>

                <span>
                    🧭 ${escapeHtml(type)}
                </span>

                <span>
                    👥 ${memberCount}${
                        maxMembers
                            ? ` / ${maxMembers}`
                            : ""
                    } travelers
                </span>

            </div>


            <div class="trip-description">

                ${escapeHtml(
                    description
                )}

            </div>


            <div class="trip-footer">

                <span class="members">

                    ${
                        creator
                            ? "Created by you"
                            : joined
                                ? "You're joining"
                                : "Open to travelers"
                    }

                </span>


                ${
                    creator
                        ? `
                            <button
                                class="join-btn"
                                type="button"
                                disabled
                                style="
                                    opacity:.6;
                                    cursor:default;
                                "
                            >
                                Your Trip
                            </button>
                        `
                        : `
                            <button
                                class="join-btn ${
                                    joined
                                        ? "joined"
                                        : ""
                                }"
                                type="button"
                                data-trip-id="${escapeHtml(
                                    trip._id ||
                                    trip.id ||
                                    ""
                                )}"
                            >
                                ${
                                    joined
                                        ? "✓ Joined"
                                        : "Join Trip"
                                }
                            </button>
                        `
                }

            </div>

        </div>

    `;


    const imageElement =
        card.querySelector(
            ".trip-image"
        );


    imageElement.addEventListener(
        "error",
        () => {

            imageElement.src =
                "logo.jpeg";

        }
    );


    const joinButton =
        card.querySelector(
            ".join-btn:not([disabled])"
        );


    if (joinButton) {

        joinButton.addEventListener(
            "click",
            () => {

                const tripId =
                    joinButton.dataset.tripId;


                toggleJoinTrip(
                    tripId,
                    joinButton
                );

            }
        );

    }


    return card;

}


// ===============================
// FORMAT DATE
// ===============================

function formatDate(value) {

    if (!value) {

        return "Date not set";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Date not set";

    }


    return date.toLocaleDateString(
        undefined,
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}


// ===============================
// ESCAPE HTML
// ===============================

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

// ===============================
// CREATE TRIP
// ===============================

createTripForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        if (!currentUser) {

            alert(
                "Please log in first."
            );

            window.location.href =
                "login.html";

            return;

        }


        const formData =
            new FormData(
                createTripForm
            );


        const tripData = {

            title:
                formData.get("title"),

            destination:
                formData.get("destination"),

            startDate:
                formData.get("startDate"),

            endDate:
                formData.get("endDate"),

            maxMembers:
                Number(
                    formData.get(
                        "maxMembers"
                    )
                ),

            tripType:
                formData.get(
                    "tripType"
                ),

            image:
                formData.get("image"),

            description:
                formData.get(
                    "description"
                )

        };


        if (
            tripData.endDate &&
            tripData.startDate &&
            tripData.endDate <
                tripData.startDate
        ) {

            alert(
                "End date cannot be before the start date."
            );

            return;

        }


        const submitButton =
            createTripForm.querySelector(
                ".submit-trip-btn"
            );


        try {

            submitButton.disabled =
                true;

            submitButton.textContent =
                "Creating...";


            /*
             * Expected backend endpoint:
             *
             * POST /trips
             */

            const response =
                await fetch(
                    "/trips",
                    {
                        method: "POST",

                        credentials:
                            "include",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                tripData
                            )
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to create trip."
                );

            }


            const newTrip =
                data.trip ||
                data.data;


            if (newTrip) {

                allTrips.unshift(
                    newTrip
                );

            }


            createTripForm.reset();

            createModal.classList.remove(
                "active"
            );


            currentTab =
                "created";


            tabs.forEach(tab => {

                tab.classList.remove(
                    "active"
                );

            });


            document
                .querySelector(
                    '[data-tab="created"]'
                )
                .classList.add(
                    "active"
                );


            renderTrips();


            alert(
                "Trip created successfully!"
            );

        }

        catch (error) {

            console.error(
                "❌ CREATE TRIP ERROR:",
                error
            );


            alert(
                error.message ||
                "Unable to create trip."
            );

        }

        finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Create Trip";

        }

    }
);


// ===============================
// JOIN / LEAVE TRIP
// ===============================

async function toggleJoinTrip(
    tripId,
    button
) {

    if (!currentUser) {

        alert(
            "Please log in to join a trip."
        );

        window.location.href =
            "login.html";

        return;

    }


    if (!tripId) {

        alert(
            "This trip does not have a valid ID."
        );

        return;

    }


    const trip =
        allTrips.find(item =>
            String(
                item._id ||
                item.id
            ) ===
            String(tripId)
        );


    if (!trip) {

        return;

    }


    const joined =
        isUserJoined(
            trip
        );


    try {

        button.disabled =
            true;

        button.textContent =
            joined
                ? "Leaving..."
                : "Joining...";


        /*
         * Expected endpoints:
         *
         * POST /trips/:id/join
         *
         * POST /trips/:id/leave
         */

        const endpoint =
            joined
                ? `/trips/${encodeURIComponent(
                    tripId
                )}/leave`
                : `/trips/${encodeURIComponent(
                    tripId
                )}/join`;


        const response =
            await fetch(
                endpoint,
                {
                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to update trip."
            );

        }


        /*
         * If the server returns
         * an updated trip, use it.
         */

        if (data.trip) {

            const index =
                allTrips.findIndex(item =>
                    String(
                        item._id ||
                        item.id
                    ) ===
                    String(tripId)
                );


            if (index !== -1) {

                allTrips[index] =
                    data.trip;

            }

        }

        else {

            /*
             * Otherwise update the local
             * member list.
             */

            const index =
                allTrips.findIndex(item =>
                    String(
                        item._id ||
                        item.id
                    ) ===
                    String(tripId)
                );


            if (index !== -1) {

                const members =
                    allTrips[index].members ||
                    [];


                const currentId =
                    currentUser._id ||
                    currentUser.id ||
                    currentUser.email;


                if (joined) {

                    allTrips[index].members =
                        members.filter(member => {

                            const memberId =
                                member._id ||
                                member.id ||
                                member.email ||
                                member;


                            return String(
                                memberId
                            ) !==
                            String(
                                currentId
                            );

                        });

                }

                else {

                    allTrips[index].members =
                        [
                            ...members,
                            currentUser
                        ];

                }

            }

        }


        renderTrips();


    }

    catch (error) {

        console.error(
            "❌ JOIN/LEAVE ERROR:",
            error
        );


        alert(
            error.message ||
            "Unable to update trip."
        );


        button.disabled =
            false;

    }

}

async function initializeTrips() {

    await loadCurrentUser();

    await loadTrips();

}


initializeTrips();

<script>

// ===============================
// SET MINIMUM DATE
// ===============================

const startDateInput =
    document.getElementById("startDate");

const endDateInput =
    document.getElementById("endDate");


function setMinimumDates() {

    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    startDateInput.min =
        today;

    endDateInput.min =
        today;

}


setMinimumDates();


// ===============================
// KEEP END DATE VALID
// ===============================

startDateInput.addEventListener(
    "change",
    () => {

        endDateInput.min =
            startDateInput.value;


        if (
            endDateInput.value &&
            endDateInput.value <
                startDateInput.value
        ) {

            endDateInput.value =
                startDateInput.value;

        }

    }
);


// ===============================
// ESCAPE KEY
// ===============================

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            createModal.classList.contains(
                "active"
            )
        ) {

            createModal.classList.remove(
                "active"
            );

        }

    }
);


// ===============================
// REFRESH TRIPS WHEN PAGE RETURNS
// ===============================

window.addEventListener(
    "pageshow",
    async () => {

        /*
         * Refresh the list when the
         * user returns to this page.
         */

        if (
            document.visibilityState ===
            "visible"
        ) {

            await loadCurrentUser();

            await loadTrips();

        }

    }
);


// ===============================
// CLEAN UP IMAGE URL
// ===============================

document.addEventListener(
    "error",
    event => {

        if (
            event.target &&
            event.target.classList &&
            event.target.classList.contains(
                "trip-image"
            )
        ) {

            event.target.src =
                "logo.jpeg";

        }

    },
    true
);


// ===============================
// FINAL INITIALIZATION
// ===============================

setMinimumDates();


// ===============================
// END
// ===============================

</script>
