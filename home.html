<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tourismo Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

background:#eef2f7;

display:flex;

height:100vh;

overflow:hidden;

}

/* LEFT SIDEBAR */

.sidebar{

width:260px;

background:#0c3b2e;

color:white;

display:flex;

flex-direction:column;

padding:20px;

}

.logo{

display:flex;

align-items:center;

margin-bottom:40px;

}

.logo img{

width:55px;

height:55px;

border-radius:50%;

margin-right:10px;

border:3px solid white;

}

.logo h2{

font-size:28px;

}

.menu{

list-style:none;

}

.menu li{

margin:20px 0;

}

.menu li a{

color:white;

text-decoration:none;

font-size:18px;

display:flex;

align-items:center;

padding:12px;

border-radius:12px;

transition:.3s;

}

.menu li a i{

margin-right:15px;

width:30px;

text-align:center;

font-size:22px;

}

.menu li a:hover{

background:#1f8f63;

transform:translateX(8px);

}

/* MAIN */

.main{

flex:1;

overflow-y:auto;

}

/* TOP BAR */

.topbar{

height:80px;

background:white;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 30px;

box-shadow:0 2px 15px rgba(0,0,0,.1);

position:sticky;

top:0;

z-index:100;

}

.search{

background:#eef2f7;

padding:12px 20px;

border-radius:30px;

width:400px;

display:flex;

align-items:center;

}

.search input{

border:none;

outline:none;

background:none;

width:100%;

font-size:16px;

margin-left:10px;

}

.icons{

display:flex;

gap:25px;

font-size:24px;

color:#0c3b2e;

cursor:pointer;

}

/* HERO */

.hero{

margin:30px;

height:320px;

border-radius:25px;

background-image:

linear-gradient(rgba(0,0,0,.45),

rgba(0,0,0,.45)),

url('https://images.unsplash.com/photo-1516026672322-bc52d61a55d5');

background-size:cover;

background-position:center;

display:flex;

align-items:center;

padding-left:60px;

color:white;

}

.hero h1{

font-size:55px;

margin-bottom:15px;

}

.hero p{

font-size:20px;

margin-bottom:25px;

max-width:600px;

}

.hero button{

padding:15px 35px;

background:#ff9800;

color:white;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

transition:.3s;

}

.hero button:hover{

background:#ff7700;

transform:scale(1.05);

}

/* CONTENT */

.container{

display:grid;

grid-template-columns:3fr 1fr;

gap:25px;

padding:0 30px 30px;

}

/* FEED */

.feed{

display:flex;

flex-direction:column;

gap:25px;

}

/* STORIES */

.stories{

display:flex;

gap:20px;

overflow-x:auto;

padding:10px;

}

.story{

min-width:90px;

text-align:center;

}

.story img{

width:75px;

height:75px;

border-radius:50%;

border:4px solid orange;

object-fit:cover;

}

.story p{

margin-top:8px;

font-size:14px;

}
.login-btn{

background:#ff9800;

color:white;

text-decoration:none;

padding:10px 15px;

border-radius:25px;

font-size:16px;

font-weight:600;

display:flex;

align-items:center;

justify-content:center;

height:35px;

transition:.3s;

box-shadow:0 5px 15px rgba(255,152,0,.3);

}

.login-btn:hover{

background:#ff7700;

transform:scale(1.05);

}


</style>

</head>

<body>

<!-- LEFT SIDEBAR -->

<div class="sidebar">

<div class="logo">

<img src="logo.jpeg">

<h2>TOURISMO</h2>

</div>

<ul class="menu">

<li><a href="#"><i class="fa-solid fa-house"></i>Home</a></li>

<li><a href="explore.html"><i class="fa-solid fa-compass"></i>Explore</a></li>

<li><a href="messages.html"><i class="fa-solid fa-message"></i>Messages</a></li>

<li><a href="#"><i class="fa-solid fa-plane"></i>Trips</a></li>

<li><a href="#"><i class="fa-solid fa-vr-cardboard"></i>Virtual Tours</a></li>

<li><a href="#"><i class="fa-solid fa-images"></i>Gallery</a></li>

<li><a href="#"><i class="fa-solid fa-heart"></i>Wishlist</a></li>

<li><a href="#"><i class="fa-solid fa-users"></i>Group Trips</a></li>
<li>

<a href="#" id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</li>

</ul>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

<div class="search">

<i class="fa fa-search"></i>

<input placeholder="Search places, friends or guides">

</div>

<div class="icons">


<i class="fa-regular fa-bell"></i>


<i class="fa-solid fa-robot"></i>

<i class="fa-solid fa-user-circle"></i>

</div>

</div>

<div class="hero">

<div>

<h1>Discover Rwanda</h1>

<p>

Explore amazing destinations,

book trips,

meet professional tour guides,

and let AI plan your perfect adventure.

</p>
<a href="explore.html">
    <button>Explore Now</button>
</a>

</div>

</div>

<div class="container">

<div class="feed">

<div class="stories">

<div class="story">
<img src="https://i.pravatar.cc/150?img=1">
<p>Patrick</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/150?img=2">
<p>Alice</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/150?img=3">
<p>John</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/150?img=4">
<p>Guide</p>
</div>

<div class="story">
<img src="https://i.pravatar.cc/150?img=5">
<p>Lake Kivu</p>
</div>

</div>
<script>


async function loadUser(){

    try{

        const response=await fetch("/me",{

            credentials:"include"

        });

        if(!response.ok){

            window.location.href="/login.html";

            return;

        }

        const user=await response.json();

        document.getElementById("welcomeUser").innerHTML=
        `Welcome, ${user.firstName}!`;

    }

    catch(err){

        console.log(err);

        window.location.href="/login.html";

    }

}

loadUser();



// LOGOUT

document.getElementById("logoutBtn")

.addEventListener("click",async function(e){

    e.preventDefault();

    await fetch("/logout",{

        method:"POST",

        credentials:"include"

    });

    window.location.href="/login.html";

});

</script>
